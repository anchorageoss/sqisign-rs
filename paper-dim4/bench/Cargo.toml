# The one-session benchmark of the dimension-4 paper (paper-dim4/main.tex,
# W05). A standalone package, excluded from the workspace: it depends on two
# versions of sqisign-rs at once, the current crate (round 3, dimension 2 and
# the compact dimension-4 format) and the last round-2 release, tag v0.4.31
# from GitHub (round 2, dimension 2 and the 108-byte compact format), so both
# are measured by the same code in one process. Run with session.sh.
[package]
name = "dim4-session"
version = "0.1.0"
edition = "2021"
publish = false

# The session binary of the earlier sessions (blocks, rounds) and the two
# binaries of the paper's own protocol (paper_session.sh): `paper` times,
# `paper_heap` measures heap peaks with a counting allocator.
[[bin]]
name = "dim4-session"
path = "src/main.rs"

[[bin]]
name = "paper"
path = "src/paper.rs"

[[bin]]
name = "paper_heap"
path = "src/paper_heap.rs"

# The two measurements of the paper that need instrumented code (the Gram
# matrices of the response lattices, the hint pairs that re-encode a
# signature when the hint check is off): feature `instrument`, never in a
# session build.
[[bin]]
name = "paper_instrument"
path = "src/paper_instrument.rs"
required-features = ["instrument"]

[dependencies]
sqisign-rs = { path = "../../crates/sqisign-rs", features = ["compact"] }
sqisign-verify = { path = "../../crates/verify", features = ["compact"] }
# The round-2 crate of the 2026-09-26 session's legacy run; needs the network to fetch.
sqisign-rs-r2 = { package = "sqisign-rs", git = "https://github.com/anchorageoss/sqisign-rs", tag = "v0.4.31", optional = true }
rand = "0.8"

[features]
default = []
round2 = ["dep:sqisign-rs-r2"]
# The Fp2 operation counts per phase (SECENG-2434); never in a session build.
op-counters = ["sqisign-verify/op-counters"]
instrument = ["sqisign-rs/instrument", "sqisign-verify/instrument"]

[profile.release]
lto = "fat"
codegen-units = 1
