name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p sqisign-verify -p sqisign-rs --release
      - run: cargo test -p sqisign-verify -p sqisign-rs --release --features compact
