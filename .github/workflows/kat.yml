name: KAT

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kat:
    name: KAT vectors (L1/L3/L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # the 300 vectors of the-sqisign at nist-v3, on the detected field
      # kernels and on the portable fallback
      - run: cargo test -p sqisign-kat --release --test kat
      - run: SQISIGN_FORCE_PORTABLE=1 cargo test -p sqisign-kat --release --test kat
