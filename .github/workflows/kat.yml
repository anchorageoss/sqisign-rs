name: KAT

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kat:
    name: KAT vectors (L1/L3/L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # KAT vectors come from the C reference, which does not canonicalize the
      # basis-change matrix. The `kat-compat` feature restores that legacy
      # encoding (and un-gates the KAT test suites), so byte-exact KAT validation
      # runs here under the flag while canonical encoding stays the default.
      - run: cargo test -p sqisign-kat --release --features kat-compat
      # The verify crate also embeds the NIST KAT response vectors for its
      # standard/expanded/compressed validation; gated on the same feature.
      - run: cargo test -p sqisign-verify --release --features kat-compat --test kat_validation
