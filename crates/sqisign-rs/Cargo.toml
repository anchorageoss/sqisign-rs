[package]
name = "sqisign-rs"
description = "SQIsign round-3 post-quantum signatures: keygen, sign, verify in pure Rust"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sqisign-verify = { version = "0.6.36", path = "../verify" }
zeroize = { workspace = true }
rand_core = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
hybrid-array = { workspace = true }
signature = { workspace = true, features = ["rand_core"] }

[features]
default = []
# The dimension-4 compact format at level I (experimental).
compact = ["sqisign-verify/compact"]

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.4"
num-bigint = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }

[[bench]]
name = "bench"
harness = false
