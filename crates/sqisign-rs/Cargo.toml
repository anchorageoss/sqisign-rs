[package]
name = "sqisign-rs"
description = "SQIsign post-quantum signatures: keygen, sign, verify in pure Rust"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sqisign-verify = { version = "0.4.0", path = "../verify" }
num-bigint = { version = "0.4", default-features = false, features = ["rand"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
num-integer = { version = "0.1", default-features = false }
crypto-bigint = { workspace = true }
zeroize = { workspace = true }
rand = { version = "0.8", default-features = false }
rand_core = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
hybrid-array = { workspace = true }
signature = { workspace = true, features = ["rand_core"] }
paste = "1"

[features]
default = []
# Disable canonical (non-malleable) basis-change matrix encoding for byte-exact
# compatibility with the C reference KAT vectors. Canonical encoding is the
# default: the signer normalizes the matrix and the verifier rejects the
# non-canonical (negated) representative, closing the malleability described in
# ePrint 2026/1305. Forwards to the verifier so both sides stay in sync. OFF by
# default.
kat-compat = ["sqisign-verify/kat-compat"]
# SQIsign-RK: signatures with randomizable keys (ePrint 2026/1169). Adds the
# RandPK / RandSK / VerKey key-randomization operations on top of base SQIsign.
# Off by default; base Sign/Verify/KeyGen are unchanged.
sqisign-rk = []

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
# For the unified-autodetect HD test vectors (parse the SQIsignHD oracle JSON).
serde_json = "1"
hex = "0.4"

[[bench]]
name = "sign_bench"
harness = false

[[bench]]
name = "sqisign_rk"
harness = false
required-features = ["sqisign-rk"]
