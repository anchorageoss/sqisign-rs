# No `-C target-cpu=native` (removed in P27): the round-3 field kernels are
# inline assembly chosen at run time, and the flag made the level V verifier
# 12 % slower on the benchmark machine (AVX-512 code generation in the
# surrounding Rust); benchmarks are of the default build, so the default
# build is what this repository compiles. The bench profile inherits the
# release profile of Cargo.toml (fat LTO, one codegen unit).
